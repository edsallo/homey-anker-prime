server {
    listen 80;
    listen [::]:80;
    server_name anker.synology.local;
    allow 10.0.1.0/24;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    client_max_body_size 8k;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 50s;
    }
}
